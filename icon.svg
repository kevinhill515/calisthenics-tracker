<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded dark background -->
  <rect width="64" height="64" rx="14" fill="#0b0d10"/>

  <!-- Soft emerald glow behind the figure -->
  <circle cx="32" cy="30" r="26" fill="#10b981" fill-opacity="0.10"/>

  <!-- Parallette resting on the ground (with two small feet underneath) -->
  <rect x="13"   y="49" width="14"  height="3"  rx="1.5" fill="#34d399"/>
  <rect x="13.5" y="52" width="2"   height="3"  rx="0.5" fill="#34d399"/>
  <rect x="24.5" y="52" width="2"   height="3"  rx="0.5" fill="#34d399"/>

  <!-- Single arm pressing up from the parallette to the shoulder -->
  <rect x="18" y="30" width="3.5" height="20" rx="1.5" fill="#34d399"/>

  <!-- Head at body level, just outside the shoulder (face forward) -->
  <circle cx="13" cy="28.5" r="3.5" fill="#34d399"/>

  <!-- Body silhouette: shoulder → torso → hip taper → legs → pointed toes -->
  <!-- proportions: torso ~13 units, legs ~22 units (~1.7× torso) -->
  <path d="
    M 17 27
    L 30 26.5
    L 33 27
    L 55 27
    L 61 28.5
    L 55 30
    L 33 30
    L 30 30.5
    L 17 30
    Z
  " fill="#34d399"/>
</svg>
