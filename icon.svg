<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded dark background -->
  <rect width="64" height="64" rx="14" fill="#0b0d10"/>

  <!-- Soft emerald glow behind the figure -->
  <circle cx="32" cy="34" r="26" fill="#10b981" fill-opacity="0.10"/>

  <!-- Pull-up bar with end-cap supports going up out of frame -->
  <rect x="4"    y="13" width="42"  height="3"  rx="1.5" fill="#34d399"/>
  <rect x="4"    y="5"  width="2.5" height="11" rx="0.5" fill="#34d399"/>
  <rect x="43.5" y="5"  width="2.5" height="11" rx="0.5" fill="#34d399"/>

  <!-- Single arm hanging straight from the bar (side-view) -->
  <rect x="18" y="14" width="3.5" height="20" rx="1.5" fill="#34d399"/>

  <!-- Head at body level, just outside the arm (looking up at the bar) -->
  <circle cx="13" cy="34" r="3.5" fill="#34d399"/>

  <!-- Body silhouette: torso (chunky) → hip taper → legs (longer) → toes -->
  <!-- proportions: torso ~13 units, legs ~22 units (~1.7× torso) -->
  <path d="
    M 17 30.5
    L 30 30
    L 33 30.5
    L 55 30.5
    L 61 32
    L 55 33.5
    L 33 33.5
    L 30 34
    L 17 33.5
    Z
  " fill="#34d399"/>
</svg>
