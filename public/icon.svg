<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded dark background -->
  <rect width="64" height="64" rx="14" fill="#0b0d10"/>

  <!-- Soft emerald glow -->
  <circle cx="32" cy="34" r="26" fill="#10b981" fill-opacity="0.10"/>

  <!-- Pull-up bar across the middle, with mounting posts going up out of frame -->
  <rect x="5"    y="19" width="54"  height="3"  rx="1.5" fill="#34d399"/>
  <rect x="5"    y="11" width="2.5" height="11" rx="0.5" fill="#34d399"/>
  <rect x="56.5" y="11" width="2.5" height="11" rx="0.5" fill="#34d399"/>

  <!-- Head ABOVE the bar (chin clearing the bar — top of a pull-up) -->
  <circle cx="32" cy="13" r="4" fill="#34d399"/>

  <!-- Bent arms gripping the bar, V-shape down to shoulders -->
  <path d="M 22 21 Q 24 26 28 30 L 36 30 Q 40 26 42 21"
        stroke="#34d399" stroke-width="4"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Torso (shoulders → hips), centered under the head -->
  <path d="M 26 30 L 38 30 L 38 45 Q 38 47 36 47 L 28 47 Q 26 47 26 45 Z"
        fill="#34d399"/>

  <!-- Two legs hanging straight down -->
  <rect x="27"   y="45" width="4.5" height="15" rx="2" fill="#34d399"/>
  <rect x="32.5" y="45" width="4.5" height="15" rx="2" fill="#34d399"/>
</svg>
