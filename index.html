<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0b0d10" />

    <!-- Browser tab favicon (modern browsers will prefer the SVG) -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />

    <!-- iOS home-screen icon. iOS doesn't reliably render SVG here, so
         we ship a 180×180 PNG generated by `npm run icons`. -->
    <link rel="apple-touch-icon" href="./icon-180.png" />

    <!-- Android Chrome / installable PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Home-screen app behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Label shown under the icon on iOS / Android home screens. -->
    <meta name="apple-mobile-web-app-title" content="Calis Tracker" />
    <meta name="application-name" content="Calis Tracker" />

    <!-- Cache-bust the html itself so iOS/Android home-screen apps pick up
         new builds quickly. Hashed JS/CSS files can stay long-cached. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
